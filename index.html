<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grind Log: study tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5FB;--surface:#fff;--ink:#14213D;--muted:#5C6985;--line:#DCE3F0;--accent:#F5A524;--accent-ink:#14213D;--hero:#14213D;--hero-ink:#EEF2FB;--hero-mute:#9FB0D3;--track:#2B3D68;--danger:#C2255C;
--c-dsa:#3B6FF0;--c-con:#8E5CF0;--c-sd:#12A38A;--c-cod:#E8590C;--c-job:#D6336C;--c-rev:#B08900;--c-oth:#7A8599;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1428;--surface:#142042;--ink:#E8EDF9;--muted:#93A2C4;--line:#243257;--hero:#1B2B52;--track:#2F4272;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1428;--surface:#142042;--ink:#E8EDF9;--muted:#93A2C4;--line:#243257;--hero:#1B2B52;--track:#2F4272;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:24px;display:grid;gap:18px}
.hero .hi{color:var(--hero-mute);font-size:15px}
.hero h1{font-size:clamp(26px,5vw,40px);font-weight:700;max-width:22ch;line-height:1.1}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(52px,12vw,92px);line-height:1;letter-spacing:-.04em;color:var(--accent)}
.big .l{color:var(--hero-mute)}
.blocks{display:flex;gap:4px}
.blocks i{flex:1;height:14px;background:var(--track);border-radius:3px;overflow:hidden;display:block}
.blocks b{display:block;height:100%;background:var(--accent);width:0}
.hrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--hero-mute);font-size:14px;align-items:center}
.hrow input{width:54px;background:transparent;border:1px solid var(--track);border-radius:8px;padding:2px 6px;color:var(--hero-ink)}
.grid{display:grid;gap:16px;margin-top:16px}
@media(min-width:880px){.grid{grid-template-columns:1.25fr 1fr;align-items:start}}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h2{font-size:20px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{background:var(--cc);border-color:var(--cc);color:#fff}
.chip[aria-pressed="true"]::before{background:#fff}
input[type=text],input[type=date],input[type=time],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.timer{display:grid;justify-items:center;gap:12px;margin:6px 0 14px}
.ringbox{position:relative;width:min(240px,70vw);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:10}
.rt{stroke:var(--line)}.rp{stroke:var(--cc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,10vw,46px);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ringtxt .s{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:8px 0 12px}
.day{margin-top:16px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.dayh h3{font-size:17px}.dayh span{color:var(--muted);font-size:14px}
.ent{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:8px 0}
.ent .dot{width:10px;height:10px;border-radius:50%}
.ent .nm{font-weight:600}.ent .sub{color:var(--muted);font-size:14px}
.ent .du{font-weight:600;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--danger)}
.empty{color:var(--muted);padding:6px 0}
.thought p{margin:0 0 12px}
.thought b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:14px;color:var(--muted);margin-bottom:2px;font-weight:500}
.thought .big2{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.rev{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border:0}
.rev .sub{color:var(--muted);font-size:13px}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:13px;padding:1px 9px;margin-left:8px;font-family:"Instrument Sans",sans-serif;vertical-align:middle}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:6px}
.bar{flex:1;display:grid;grid-template-rows:1fr auto auto;gap:4px;height:100%;text-align:center;font-size:12px;color:var(--muted)}
.bar div{align-self:end;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
.bar.today div{background:var(--c-dsa)}
.cat{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.cat i{display:block;height:8px;background:var(--line);border-radius:5px;overflow:hidden}.cat i b{display:block;height:100%;border-radius:5px}
.cat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px monospace}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero" aria-label="Today">
  <div class="hi" id="hi"></div>
  <h1 id="quote"></h1>
  <div class="big"><span class="n" id="todayN">0m</span><span class="l" id="todayL"></span></div>
  <div class="blocks" id="blocks" aria-hidden="true"></div>
  <div class="hrow"><span id="streak"></span><label>Daily goal <input type="number" id="goal" min="1" max="16" step="0.5"> hours</label></div>
</section>

<div class="grid">
<div class="col">
  <section class="card" aria-label="Timer">
    <h2>Study timer</h2>
    <div class="chips" id="chips"></div>
    <div class="timer">
      <div class="ringbox" id="ringbox"><svg viewBox="0 0 200 200"><circle class="rt" cx="100" cy="100" r="90"/><circle class="rp" id="rp" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="565.49"/></svg>
        <div class="ringtxt"><div class="t" id="tt">00:00:00</div><div class="s" id="ts">Ready when you are</div></div></div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="bStart">Start</button>
        <button class="btn ghost" id="bSave" disabled>Save</button>
        <button class="btn ghost danger" id="bDisc" disabled>Discard</button>
      </div>
    </div>
    <input type="text" id="note" placeholder="What are you working on? e.g. Sliding window, Kafka basics" maxlength="80">
    <label class="check"><input type="checkbox" id="addRev"> Remind me to revise this (1, 3, 7, 14, 30 days)</label>
    <details><summary>Forgot to start the timer? Add a session by hand</summary>
      <div class="f2"><input type="date" id="mDate" aria-label="Date"><select id="mCat" aria-label="Category"></select>
      <input type="time" id="mFrom" aria-label="From"><input type="time" id="mTo" aria-label="To"></div>
      <input type="text" id="mNote" placeholder="Note (optional)" maxlength="80">
      <button class="btn sm" id="mAdd" style="margin-top:10px">Add session</button></details>
  </section>

  <section class="card" aria-label="Study log">
    <h2>Study log</h2>
    <div id="log"></div>
    <button class="btn ghost sm" id="more" style="margin-top:14px" hidden>Show older days</button>
  </section>
</div>

<div class="col">
  <section class="card thought" aria-label="Thought of the day">
    <h2>Today’s thought</h2>
    <p><b>Do this today</b><span class="big2" id="doToday"></span></p>
    <p style="margin:0"><b>System design thought</b><span id="sdThought"></span></p>
  </section>

  <section class="card" aria-label="Revision">
    <h2>Revision <span class="badge" id="dueBadge" hidden></span></h2>
    <div id="rev"></div>
    <div class="row" style="margin-top:12px"><input type="text" id="rTopic" placeholder="Add a topic to revise" maxlength="80" style="flex:1;min-width:150px"><button class="btn sm" id="rAdd">Add</button></div>
  </section>

  <section class="card" aria-label="This week">
    <h2>Last 7 days</h2>
    <div class="bars" id="bars"></div>
    <div id="cats" style="margin-top:14px"></div>
  </section>

  <section class="card" aria-label="Backup">
    <h2>Your data</h2>
    <p class="sub" style="color:var(--muted);margin:0 0 8px;font-size:14px"><span id="syncs">Checking sync…</span> You can also copy a manual backup below.</p>
    <div class="row"><button class="btn ghost sm" id="bExp">Show backup</button><button class="btn ghost sm" id="bImp">Restore from text</button></div>
    <textarea id="bTxt" placeholder="Backup text appears here. Paste it here to restore." style="margin-top:8px"></textarea>
  </section>
</div>
</div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const BASE=[["dsa","DSA","--c-dsa"],["con","Concepts","--c-con"],["sd","System design","--c-sd"],["cod","Coding","--c-cod"],["job","Job applications","--c-job"],["rev","Revision","--c-rev"],["oth","Other","--c-oth"]];
let CATS=BASE;
const PAL=["#0B7285","#5F3DC4","#2B8A3E","#A61E4D","#364FC7","#E67700"];
function buildCats(){CATS=[...BASE,...(S.custom||[]).map(c=>{document.documentElement.style.setProperty("--cx-"+c.id,c.color);return[c.id,c.name,"--cx-"+c.id]})]}
const QUOTES=["Small hours, stacked daily, turn into offers.","You don’t need motivation. You need the next 25 minutes.","Hard problems feel impossible until they become familiar.","Consistency beats intensity. Show up again today.","Every problem you solve is one fewer surprise in the interview.","Slow is fine. Stopped is not.","Reviewing beats rereading. Revise what you learned.","Interviews test patterns. You’re collecting patterns.","Rest is part of the plan. Guilt is not.","Today’s effort is tomorrow’s confidence."];
const DO=["Re-solve a problem you solved before, from scratch and timed.","Pick a sliding-window problem and say the invariant out loud.","Write the brute force first, then explain exactly why it is slow.","Dry-run BFS and DFS on the same small graph and compare the order.","Redo your last wrong answer and write the mistake in one line.","Implement an LRU cache from memory.","Pick a binary search problem and define the search space before coding.","Explain recursion, memoization and tabulation using Fibonacci, in your own words.","Apply to two jobs and tailor your top resume bullet for each.","Do a 30-minute mock interview and think aloud the whole time."];
const SD=["Start with requirements and scale numbers. The architecture follows from them.","A cache is a bet on read patterns. State the eviction policy and what happens on a miss.","Every queue needs an answer for when consumers fall behind.","Sharding decides which queries are cheap. Pick the key from your most common read.","Idempotency turns retries from a danger into a tool.","Replication buys availability and costs you consistency decisions. Name them.","Find the single point of failure first, then the hottest key.","For rate limiting, compare token bucket and sliding window, and where the counter lives.","Prefer boring tech in the data path. Get fancy only where the numbers demand it.","Say the trade-off out loud: latency vs consistency, cost vs durability."];
const INT=[1,3,7,14,30];
const KEY="grindlog:v1";
let S={sessions:[],revs:[],goal:6,timer:{cat:"dsa",first:null,seg:null,acc:0}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
buildCats();
const $=s=>document.querySelector(s);
const lsave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{S.updated=Date.now();lsave();push()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);return dk(new Date(y,m-1,d+n).getTime())};
const clock=ms=>new Date(ms).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dur=s=>{const m=Math.round(s/60),h=Math.floor(m/60);return h?h+"h "+String(m%60).padStart(2,"0")+"m":(m<1?"<1m":m+"m")};
const hms=s=>[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,"0")).join(":");
const cat=id=>CATS.find(c=>c[0]===id)||CATS[6];
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2800)};
const day0=new Date();const doy=Math.floor((day0-new Date(day0.getFullYear(),0,0))/864e5);

// timer
const T=()=>S.timer;
const elapsed=()=>Math.floor((T().acc+(T().seg?Date.now()-T().seg:0))/1000);
function renderTimer(){
  const e=elapsed(),t=T(),run=!!t.seg,has=t.first!==null;
  $("#tt").textContent=hms(e);
  $("#rp").style.strokeDashoffset=565.49*(1-(e%3600)/3600);
  $("#ringbox").style.setProperty("--cc","var("+cat(t.cat)[2]+")");
  $("#ts").textContent=run?"Focusing on "+cat(t.cat)[1]:has?"Paused":"Ready when you are";
  $("#bStart").textContent=run?"Pause":has?"Resume":"Start";
  $("#bSave").disabled=!has;$("#bDisc").disabled=!has;
  renderHero();
}
$("#bStart").onclick=()=>{const t=T(),n=Date.now();
  if(t.seg){t.acc+=n-t.seg;t.seg=null}else{if(t.first===null)t.first=n;t.seg=n}
  save();renderTimer()};
$("#bSave").onclick=()=>{const t=T(),n=Date.now();if(t.seg){t.acc+=n-t.seg;t.seg=null}
  const secs=Math.round(t.acc/1000);if(secs<1)return;
  const note=$("#note").value.trim();
  S.sessions.push({id:n,cat:t.cat,note,start:t.first,end:n,secs});
  if($("#addRev").checked)addRev(note||cat(t.cat)[1]+" session",t.cat);
  toast("Saved "+dur(secs)+" of "+cat(t.cat)[1]+", "+clock(t.first)+" to "+clock(n));
  S.timer={cat:t.cat,first:null,seg:null,acc:0};$("#note").value="";$("#addRev").checked=false;
  save();renderAll()};
let dArm=0;
$("#bDisc").onclick=()=>{const b=$("#bDisc");if(!dArm){dArm=1;b.textContent="Click again to discard";setTimeout(()=>{dArm=0;b.textContent="Discard"},3000);return}
  dArm=0;b.textContent="Discard";S.timer={cat:T().cat,first:null,seg:null,acc:0};save();renderTimer();toast("Timer discarded")};

// chips
let adding=false;
function renderChips(){
  const mc=$("#mCat"),cur=mc.value;mc.innerHTML=CATS.map(c=>`<option value="${c[0]}">${esc(c[1])}</option>`).join("");if(cur)mc.value=cur;
  $("#chips").innerHTML=CATS.map(c=>`<button class="chip" style="--cc:var(${c[2]})" data-c="${c[0]}" aria-pressed="${T().cat===c[0]}">${esc(c[1])}</button>`).join("")+(adding?`<input type="text" id="newCat" maxlength="24" placeholder="e.g. TypeScript" style="width:170px" aria-label="New category name"><button class="btn sm" id="okCat">Add</button>`:`<button class="chip" id="plusCat" style="--cc:var(--muted)">+ Add category</button>`);
  $("#chips").querySelectorAll(".chip[data-c]").forEach(b=>b.onclick=()=>{T().cat=b.dataset.c;save();renderChips();renderTimer()});
  const p=$("#plusCat");if(p)p.onclick=()=>{adding=true;renderChips();$("#newCat").focus()};
  const ok=$("#okCat");if(ok){const go=()=>{const n=$("#newCat").value.trim();if(!n)return;
    const c={id:"u"+Date.now(),name:n,color:PAL[(S.custom||[]).length%PAL.length]};
    S.custom=[...(S.custom||[]),c];buildCats();T().cat=c.id;adding=false;save();renderAll();toast("Added category: "+n)};
    ok.onclick=go;$("#newCat").onkeydown=e=>{if(e.key==="Enter")go();if(e.key==="Escape"){adding=false;renderChips()}}}
}

// manual
$("#mDate").value=dk(Date.now());
$("#mAdd").onclick=()=>{const d=$("#mDate").value,f=$("#mFrom").value,t=$("#mTo").value;
  if(!d||!f||!t){toast("Fill in the date, from and to times");return}
  const [y,m,dd]=d.split("-").map(Number),[fh,fm]=f.split(":").map(Number),[th,tm]=t.split(":").map(Number);
  const a=new Date(y,m-1,dd,fh,fm).getTime(),b=new Date(y,m-1,dd,th,tm).getTime();
  if(b<=a){toast("End time must be after start time");return}
  S.sessions.push({id:Date.now(),cat:$("#mCat").value,note:$("#mNote").value.trim(),start:a,end:b,secs:Math.round((b-a)/1000)});
  $("#mNote").value="";save();renderAll();toast("Session added")};

// hero
const secsOn=k=>S.sessions.filter(s=>dk(s.start)===k).reduce((a,s)=>a+s.secs,0);
function streak(){let k=dk(Date.now()),n=0;if(!secsOn(k)&&!(T().first&&dk(T().first)===k))k=addDays(k,-1);
  while(secsOn(k)){n++;k=addDays(k,-1)}return n}
function renderHero(){
  const h=new Date().getHours(),today=dk(Date.now());
  const live=T().first&&dk(T().first)===today?elapsed():0;
  const tot=secsOn(today)+live,goal=S.goal*3600;
  $("#hi").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+". Here’s today so far.";
  $("#quote").textContent=QUOTES[doy%QUOTES.length];
  $("#todayN").textContent=dur(tot).replace("<1m","0m");
  $("#todayL").textContent=tot>=goal?"Goal reached. Everything now is a bonus.":"of "+S.goal+"h goal, "+dur(Math.max(goal-tot,0))+" to go";
  const nb=Math.ceil(S.goal*2);
  if($("#blocks").children.length!==nb)$("#blocks").innerHTML=Array.from({length:nb},()=>"<i><b></b></i>").join("");
  [...$("#blocks").children].forEach((e,i)=>e.firstChild.style.width=Math.max(0,Math.min(1,(tot/60-i*30)/30))*100+"%");
  const st=streak();$("#streak").textContent=st?st+"-day streak. Keep it alive today.":"Start today to begin a streak.";
}
$("#goal").value=S.goal;
$("#goal").onchange=e=>{S.goal=Math.max(1,Math.min(16,parseFloat(e.target.value)||6));e.target.value=S.goal;save();renderHero()};

// log
let shown=5;
function dayLabel(k){const t=dk(Date.now());if(k===t)return"Today";if(k===addDays(t,-1))return"Yesterday";if(k===addDays(t,-2))return"Day before yesterday";
  const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})}
function renderLog(){
  const by={};S.sessions.forEach(s=>(by[dk(s.start)]=by[dk(s.start)]||[]).push(s));
  const keys=Object.keys(by).sort().reverse();
  if(!keys.length){$("#log").innerHTML='<div class="empty">Nothing logged yet. Pick a category above and press Start.</div>';$("#more").hidden=true;return}
  $("#log").innerHTML=keys.slice(0,shown).map(k=>{
    const L=by[k].sort((a,b)=>b.start-a.start),per={};
    L.forEach(s=>per[s.cat]=(per[s.cat]||0)+s.secs);
    const sum=Object.entries(per).sort((a,b)=>b[1]-a[1]).map(([c,v])=>cat(c)[1]+" "+dur(v)).join(", ");
    return `<div class="day"><div class="dayh"><h3>${dayLabel(k)}</h3><span>${dur(L.reduce((a,s)=>a+s.secs,0))} total</span></div>
    <div class="sub" style="color:var(--muted);font-size:13px;margin-bottom:4px">${esc(sum)}</div>`+
    L.map(s=>`<div class="ent"><span class="dot" style="background:var(${cat(s.cat)[2]})"></span>
      <div><div class="nm">${cat(s.cat)[1]}${s.note?": "+esc(s.note):""}</div><div class="sub">${clock(s.start)} to ${clock(s.end)}</div></div>
      <span class="du">${dur(s.secs)}</span><button class="x" data-del="${s.id}" aria-label="Delete session">×</button></div>`).join("")+"</div>"}).join("");
  $("#log").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.sessions=S.sessions.filter(s=>s.id!=b.dataset.del);save();renderAll();toast("Session deleted")});
  $("#more").hidden=keys.length<=shown;
}
$("#more").onclick=()=>{shown+=7;renderLog()};

// thought
$("#doToday").textContent=DO[doy%DO.length];
$("#sdThought").textContent=SD[doy%SD.length];

// revision
function addRev(topic,c){S.revs.push({id:Date.now()+Math.random(),topic,cat:c,stage:0,due:addDays(dk(Date.now()),INT[0])});save()}
$("#rAdd").onclick=()=>{const v=$("#rTopic").value.trim();if(!v)return;addRev(v,"oth");$("#rTopic").value="";renderRev();toast("First revision is tomorrow")};
$("#rTopic").onkeydown=e=>{if(e.key==="Enter")$("#rAdd").click()};
function renderRev(){
  const t=dk(Date.now()),R=[...S.revs].sort((a,b)=>a.due<b.due?-1:1),due=R.filter(r=>r.due<=t);
  $("#dueBadge").hidden=!due.length;$("#dueBadge").textContent=due.length+" due";
  document.title=(due.length?"("+due.length+") ":"")+"Grind Log: study tracker";
  if(!R.length){$("#rev").innerHTML='<div class="empty">No topics yet. Tick “Remind me to revise” when you save a session.</div>';return}
  $("#rev").innerHTML=R.slice(0,10).map(r=>{const d=r.due<=t;
    return `<div class="rev"><div><div>${esc(r.topic)}</div><div class="sub">${d?"Due now":"Due "+dayLabel(r.due).replace("Today","today")} · round ${r.stage+1} of ${INT.length}</div></div>
    <div class="row"><button class="btn sm ${d?"":"ghost"}" data-ok="${r.id}">${d?"Revised":"Done early"}</button><button class="x" data-rm="${r.id}" aria-label="Remove topic">×</button></div></div>`}).join("");
  $("#rev").querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const r=S.revs.find(x=>x.id==b.dataset.ok);r.stage++;
    if(r.stage>=INT.length){S.revs=S.revs.filter(x=>x!==r);toast("Mastered: "+r.topic)}else{r.due=addDays(dk(Date.now()),INT[r.stage]);toast("Next revision in "+INT[r.stage]+" days")}
    save();renderRev()});
  $("#rev").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.revs=S.revs.filter(x=>x.id!=b.dataset.rm);save();renderRev()});
}

// week
function renderWeek(){
  const t=dk(Date.now()),ks=Array.from({length:7},(_,i)=>addDays(t,i-6)),v=ks.map(secsOn),mx=Math.max(...v,3600);
  $("#bars").innerHTML=ks.map((k,i)=>{const [y,m,d]=k.split("-").map(Number);
    return `<div class="bar ${k===t?"today":""}"><div style="height:${v[i]/mx*100}%"></div><span>${v[i]?(v[i]/3600).toFixed(1)+"h":"–"}</span><span>${new Date(y,m-1,d).toLocaleDateString([],{weekday:"short"})}</span></div>`}).join("");
  const per={};S.sessions.filter(s=>ks.includes(dk(s.start))).forEach(s=>per[s.cat]=(per[s.cat]||0)+s.secs);
  const tot=Object.values(per).reduce((a,b)=>a+b,0);
  $("#cats").innerHTML=tot?Object.entries(per).sort((a,b)=>b[1]-a[1]).map(([c,s])=>`<div class="cat"><span>${cat(c)[1]}</span><i><b style="width:${s/tot*100}%;background:var(${cat(c)[2]})"></b></i><span>${dur(s)}</span></div>`).join(""):'<div class="empty">Your time split shows up here.</div>';
}

// backup
$("#bExp").onclick=()=>{$("#bTxt").value=JSON.stringify({sessions:S.sessions,revs:S.revs,goal:S.goal,custom:S.custom||[]});$("#bTxt").select();toast("Copy this text and keep it safe")};
$("#bImp").onclick=()=>{try{const d=JSON.parse($("#bTxt").value);if(!Array.isArray(d.sessions))throw 0;
  S.sessions=d.sessions;S.revs=Array.isArray(d.revs)?d.revs:[];S.goal=d.goal||6;S.custom=Array.isArray(d.custom)?d.custom:[];buildCats();save();$("#goal").value=S.goal;renderAll();toast("Backup restored")}catch(e){toast("That text is not a valid backup")}};

function renderAll(){renderChips();renderTimer();renderLog();renderRev();renderWeek()}
renderAll();
setInterval(()=>{if(T().seg)renderTimer()},1000);

// cloud sync: Neon Postgres through the /api/state function on Vercel
let ON=false,syncT=0,warned=false;
const PASSK="grindlog:pass";
function setSync(k){const m={ok:"Synced to your database, so your data is available on any device.",saving:"Saving\u2026",off:"Can\u2019t reach the server, so data is saved on this device only.",err:"Couldn\u2019t sync. Data is still saved on this device."};
  $("#syncs").textContent=m[k]||m.off;if(k==="err"&&!warned){warned=true;toast(m.err)}}
async function api(method,body){
  for(let i=0;i<2;i++){
    let pass="";try{pass=localStorage.getItem(PASSK)||""}catch(e){}
    const r=await fetch("/api/state",{method,headers:{"Content-Type":"application/json","x-passcode":pass},body:body?JSON.stringify(body):undefined,cache:"no-store"});
    if(r.status===401){const p=window.prompt("Enter your passcode");if(!p)throw new Error("auth");try{localStorage.setItem(PASSK,p)}catch(e){}continue}
    if(!r.ok)throw new Error("http "+r.status);
    return r.json();
  }
  throw new Error("auth");
}
const snap=()=>({sessions:S.sessions,revs:S.revs,goal:S.goal,custom:S.custom||[],timer:S.timer,updated:S.updated||0});
function push(){if(!ON)return;clearTimeout(syncT);setSync("saving");
  syncT=setTimeout(async()=>{try{await api("PUT",snap());warned=false;setSync("ok")}catch(e){setSync("err")}},600)}
const union=(a,b)=>{const m=new Map();[...(b||[]),...(a||[])].forEach(x=>m.set(x.id,x));return[...m.values()]};
function applyRemote(r){S.sessions=r.sessions||[];S.revs=r.revs||[];S.goal=r.goal||6;S.custom=r.custom||[];S.timer=r.timer||S.timer;S.updated=r.updated||0;buildCats()}
async function pull(){
  const {data:r}=await api("GET");
  if(!r){S.synced=true;S.updated=Date.now();lsave();await api("PUT",snap());ON=true;return setSync("ok")}
  if(!S.synced){
    const tm=S.timer.first!==null?S.timer:(r.timer||S.timer);
    S.sessions=union(S.sessions,r.sessions);S.revs=union(S.revs,r.revs);S.custom=union(S.custom,r.custom);S.goal=r.goal||S.goal;S.timer=tm;buildCats();
    S.synced=true;S.updated=Date.now();lsave();await api("PUT",snap())
  }else if((r.updated||0)>(S.updated||0)){applyRemote(r);lsave()}
  else if((r.updated||0)<(S.updated||0))await api("PUT",snap());
  ON=true;$("#goal").value=S.goal;renderAll();setSync("ok")}
pull().then(()=>document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull().catch(()=>{})})).catch(()=>setSync("off"));
</script>
